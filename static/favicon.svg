<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="50%" stop-color="#FFE614" />
      <stop offset="100%" stop-color="#E5A800" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181e2b" />
      <stop offset="100%" stop-color="#0c0f16" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Pill / Card -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#darkGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Cinema play corner marker -->
  <polygon points="46,12 52,12 52,18" fill="#FFE614" opacity="0.8" />
  <polygon points="12,46 12,52 18,52" fill="#FFE614" opacity="0.8" />

  <!-- Monogram KCT -->
  <g filter="url(#glow)">
    <!-- Letter K -->
    <path d="M 14 20 L 19 20 L 19 44 L 14 44 Z" fill="url(#goldGrad)" />
    <path d="M 19 32 L 28 20 L 33 20 L 23 33 L 34 44 L 28 44 Z" fill="url(#goldGrad)" />

    <!-- Letter C -->
    <path d="M 45 23 C 42 20 37 20 35 23 C 32 27 32 37 35 41 C 37 44 42 44 45 41 L 45 37 C 43 39 39 39 38 37 C 36 34 36 30 38 27 C 39 25 43 25 45 27 Z" fill="#FFFFFF" />

    <!-- Film strip dot accents -->
    <circle cx="53" cy="28" r="2" fill="#FFE614" />
    <circle cx="53" cy="36" r="2" fill="#FFE614" />
  </g>
</svg>
